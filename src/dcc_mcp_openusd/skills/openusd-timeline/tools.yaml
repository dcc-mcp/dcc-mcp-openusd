tools:
  - name: import_timeline
    description: >-
      Apply an OpenTimelineIO timeline to a stage. Sets startTimeCode,
      endTimeCode and timeCodesPerSecond from the timeline and authors the
      track/clip/gap structure under the timeline prim so it can be exported
      again. Requires the optional opentimelineio package. Without
      start_time_code the time codes follow the 0-based to 1-based conversion,
      which resets an anchored shot to a 1-based range: via next-tools this
      tool is offered as the on-failure retry of verify_timeline_parity, and
      that suggestion carries no arguments, so an anchored 1001..1084 shot
      becomes 1..84 when the retry is followed verbatim. Re-supply
      start_time_code on every retry.
    input_schema:
      type: object
      required: [stage_file]
      properties:
        stage_file:
          type: string
          description: Stage file to mutate.
        otio_file:
          type: string
          description: >-
            Path to an .otio file. Exactly one of otio_file or otio_json is required.
        otio_json:
          type: string
          description: >-
            Inline OTIO JSON string. Exactly one of otio_file or otio_json is required.
        timeline_prim_path:
          type: string
          default: /World/Timeline
          description: Prim path that owns the authored timeline subtree.
        frames_per_second:
          type: number
          description: >-
            Frame rate to author. Defaults to the rate of the OTIO timeline.
        author_clips:
          type: boolean
          default: true
          description: >-
            Author the track/clip/gap subtree. Set false to only set time codes.
        start_time_code:
          type: number
          description: >-
            Anchor the shot on this start time code instead of the value the
            0-based to 1-based conversion derives. Use it to keep a 1001 (or
            other) pipeline base; the end time code shifts with it. Omitting it
            resets the shot to a 1-based range, so it must be passed again on
            every retry of an anchored import.
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    timeout_hint_secs: 60
    source_file: scripts/import_timeline.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - openusd_timeline__verify_timeline_parity
        - openusd_timeline__export_timeline

  - name: export_timeline
    description: >-
      Read a stage's time axis and time samples and produce an
      OpenTimelineIO timeline. Rebuilds the edit from the authored timeline
      subtree, or synthesizes a single video track covering the stage range.
      Writing output_file creates parent directories and writes the file, so
      this tool is not read-only. Requires the optional opentimelineio package.
    input_schema:
      type: object
      required: [stage_file]
      properties:
        stage_file:
          type: string
          description: Stage file to read.
        output_file:
          type: string
          description: >-
            Optional path to write the OTIO file to. When omitted, the
            timeline is only returned as otio_json.
        timeline_prim_path:
          type: string
          default: /World/Timeline
          description: Prim path that owns the authored timeline subtree.
        name:
          type: string
          description: Override the exported timeline name.
        include_json:
          type: boolean
          description: >-
            Include otio_json in the result. Defaults to true when output_file
            is omitted.
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    timeout_hint_secs: 60
    source_file: scripts/export_timeline.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - openusd_timeline__verify_timeline_parity
        - openusd_stage__list_stage

  - name: verify_timeline_parity
    description: >-
      Assert that a stage and an OpenTimelineIO timeline describe the same
      edit. With a reference timeline it is imported and exported again, then
      track count, clip count, total frames, clip names, in-points, durations,
      positions and the derived time codes are compared field by field.
      Without one the stage's own export is re-read and compared to itself.
      Requires the optional opentimelineio package. On failure this tool
      suggests import_timeline as a retry; that suggestion carries no
      arguments, so following it drops an anchored start_time_code and resets
      the shot to a 1-based range. Re-supply start_time_code on the retry.
    input_schema:
      type: object
      required: [stage_file]
      properties:
        stage_file:
          type: string
          description: Stage file to verify.
        otio_file:
          type: string
          description: >-
            Path to the reference .otio file. Optional; omit to self-check the
            stage's own export.
        otio_json:
          type: string
          description: >-
            Inline reference OTIO JSON string. Optional; omit to self-check the
            stage's own export.
        timeline_prim_path:
          type: string
          default: /World/Timeline
          description: Prim path that owns the authored timeline subtree.
        frames_per_second:
          type: number
          description: >-
            Frame rate used when re-importing the reference timeline.
        start_time_code:
          type: number
          description: >-
            Start time code used when re-importing the reference timeline.
            Pass the same value that was used for import_timeline, otherwise
            the re-import rewrites the shot back onto a 1-based range.
        tolerance:
          type: number
          default: 0.000001
          description: Absolute tolerance used when comparing frame values.
    read_only: false
    destructive: false
    idempotent: true
    execution: sync
    timeout_hint_secs: 60
    source_file: scripts/verify_timeline_parity.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    next-tools:
      on-success:
        - openusd_validate__validate_stage
      on-failure:
        - openusd_timeline__import_timeline
        - openusd_animation__set_time_codes
    # next-tools carries tool names only — dcc-mcp-core does not interpolate
    # argument values into a suggested follow-up call. Retrying
    # openusd_timeline__import_timeline from this binding therefore re-runs it
    # without start_time_code, which resets an anchored shot to a 1-based range
    # (1001..1084 becomes 1..84) silently. Callers must re-supply
    # start_time_code themselves when following this suggestion.
    next-tools-notes:
      on-failure:
        openusd_timeline__import_timeline: >-
          Resets the time code base: re-running it without start_time_code
          moves an anchored shot back to a 1-based range. Re-supply the
          start_time_code used for the original import.
        openusd_animation__set_time_codes: >-
          Repair path: re-asserts startTimeCode/endTimeCode directly, so it
          can restore a lost 1001 base but does not itself re-run the import.
